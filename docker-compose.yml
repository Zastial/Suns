services:
  suns:
    container_name: suns
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://suns.zastial.com}
    image: suns-site:latest
    restart: unless-stopped
    # uniquement en local : Apache (sur le serveur) fait le reverse proxy
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
